# Traefik static config — hermes-stack edge (VPN/LAN default, no ACME)
# For Let's Encrypt use traefik.acme.yml (TRAEFIK_ACME_ENABLED=active).

api:
  dashboard: false

# Prometheus metrics on a dedicated entrypoint for the monitor scrape job.
metrics:
  prometheus:
    entryPoint: metrics
    addEntryPointsLabels: true
    addServicesLabels: true
    addRoutersLabels: true

entryPoints:
  web:
    address: ":80"
  zalo-internal:
    address: ":8081"
  metrics:
    address: ":8082"

providers:
  file:
    directory: /etc/traefik/dynamic
    watch: true

log:
  level: INFO

accessLog: {}
